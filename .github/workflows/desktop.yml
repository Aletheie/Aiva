name: Desktop checks and native packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            device: macos
          - os: windows-2022
            device: windows
          - os: ubuntu-24.04
            device: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      AIVA_REQUIRE_JDK_TESTS: '1'
      AIVA_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev xvfb curl patchelf librsvg2-dev libgirepository1.0-dev
      - name: Windows installer tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Generate official host runners
        run: dart tool/bootstrap.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Record toolchain and dependency graph
        shell: bash
        run: |
          mkdir -p artifacts
          flutter --version > artifacts/flutter-version.txt
          flutter pub deps --style=compact > artifacts/dependencies.txt
          dart tool/ci_environment.dart
      - name: Parse and format Dart sources
        run: dart format lib test integration_test tool
      - name: Analyzer
        run: flutter analyze --no-fatal-infos
      - name: Content index
        run: dart tool/content_index.dart --check
      - name: Unit, widget and Java process tests
        run: flutter test --reporter expanded
      - name: Independent source and SQL checks
        run: |
          python scripts/verify_source.py
          python scripts/verify_sql_schema.py
      - name: Independent Java reference checks
        run: python scripts/verify_java.py --report artifacts/java-reference-report.json
      - name: Native integration and real screenshots (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a flutter test integration_test/app_test.dart -d linux
      - name: Native integration and real screenshots (Windows/macOS)
        if: runner.os != 'Linux'
        run: flutter test integration_test/app_test.dart -d ${{ matrix.device }}
      - name: macOS build and DMG
        if: runner.os == 'macOS'
        run: bash scripts/package_macos.sh
      - name: Windows build, portable ZIP and EXE installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Prepare official AppImage packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tools="$RUNNER_TEMP/aiva-packagers"
          mkdir -p "$tools" artifacts
          curl --fail --location --retry 3 'https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage' -o "$tools/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh' -o "$tools/linuxdeploy-plugin-gtk.sh"
          chmod +x "$tools"/*
          sha256sum "$tools"/* > artifacts/appimage-tool-hashes.txt
          echo "$tools" >> "$GITHUB_PATH"
          echo "LINUXDEPLOY=$tools/linuxdeploy-x86_64.AppImage" >> "$GITHUB_ENV"
      - name: Linux build, DEB and AppImage
        if: runner.os == 'Linux'
        run: bash scripts/package_linux.sh
      - name: Upload diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.device }}
          path: |
            artifacts/
            pubspec.lock
          if-no-files-found: warn
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Aiva-${{ matrix.device }}
          path: dist/
          if-no-files-found: error
